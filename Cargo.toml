[package]
name = "rustpaper"
version = "0.1.0"
edition = "2024"
description = "A fast Rust multi-monitor wallpaper manager for Linux (GNOME/Wayland) with per-monitor wallpapers, PPI/bezel-aware spanning, profiles, slideshows, and light/dark mode support."

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.31"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "bmp",
    "gif",
] }
rand = "0.9"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
toml = "0.8"
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }

[profile.release]
opt-level = 3
lto = "thin"
